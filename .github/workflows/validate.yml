name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"
      - name: terraform fmt
        run: terraform fmt -check -recursive

  validate:
    name: Validate modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [vpc, eks, rds, alb]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"
      - name: terraform init
        run: terraform init -backend=false
        working-directory: modules/${{ matrix.module }}
      - name: terraform validate
        run: terraform validate
        working-directory: modules/${{ matrix.module }}

  test:
    name: Plan tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [vpc, eks, rds, alb]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          # mock_provider needs 1.7 or newer. The modules themselves still
          # support 1.5, which the validate job checks.
          terraform_version: "~1.15"
      - name: terraform init
        run: terraform init -backend=false
        working-directory: modules/${{ matrix.module }}
      - name: terraform test
        # Mock providers stand in for AWS, so this needs no account and no
        # credentials. The terratests in tests/ cover real applies.
        run: terraform test
        working-directory: modules/${{ matrix.module }}

  policy:
    name: Policy (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install checkov==3.4.7
      - name: Check the modules against the AWS policy set
        # A finding fails the build. A deliberate exception is a
        # checkov:skip comment on the resource, with the reason next to it.
        run: checkov -d modules --framework terraform --compact --quiet

  tflint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
        with:
          # Pinned so a new tflint release cannot turn main red on its own.
          tflint_version: v0.66.0
      - name: Init tflint
        env:
          # Plugin downloads hit the GitHub API, which rate-limits anonymous calls.
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - name: Run tflint
        # --recursive only reads the root config when it is given as an
        # absolute path. Otherwise each directory runs without the AWS ruleset.
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  docs:
    name: terraform-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install terraform-docs
        env:
          TFDOCS_VERSION: v0.24.0
        run: |
          curl -sSLo terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo install terraform-docs /usr/local/bin/
      - name: Regenerate module docs
        run: |
          for module in modules/*/; do
            terraform-docs --config .terraform-docs.yml "$module"
          done
      - name: Fail if docs are out of date
        run: |
          if ! git diff --exit-code -- 'modules/*/README.md'; then
            echo "::error::module docs are stale. Run terraform-docs and commit the result." >&2
            exit 1
          fi
